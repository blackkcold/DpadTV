services:
  douban-cache:
    image: node:20-alpine
    container_name: douban-cache
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8898"
      CACHE_DIR: /data/cache
      # 榜单按天变化：缓存 7 天比「缓存太旧」更值钱，限流才是真问题
      TTL_SECONDS: "604800"
      # 全局串行间隔：侧车是唯一出口，宁可慢也不要被封
      MIN_GAP_MS: "6000"
      # 0 = 只读缓存（验收期专用）。生产必须是 1，否则客户端会看到 offline-miss
      ALLOW_UPSTREAM: "1"
      # 每天几点自动预热榜单矩阵
      PREWARM_HOUR: "3"
    command: ["node", "/app/server.js"]
    volumes:
      - /overlay/upper/opt/docker/Configs/douban-cache:/data
      - /overlay/upper/opt/docker/Configs/douban-cache/app:/app:ro
    mem_limit: 128m
